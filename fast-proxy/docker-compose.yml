version: '3.8'
services:
  fast-proxy:
    build: .
    # 如果已构建镜像, 可改用: image: fast-proxy:latest
    container_name: fast-proxy
    restart: unless-stopped
    environment:
      - PROXY_MODE=http
      - PROXY_USER=admin
      - PROXY_PASS=changeMeInProdUse@2026
      - PROXY_PORT=1080
    ports:
      # 宿主机 1080 端口映射, 本地开发机通过 192.168.50.100:1080 访问代理
      - "1080:1080"
    networks:
      - app-net

networks:
  app-net:
    external: true
    # 替换为实际的 Docker overlay2 网络名称
    # 查看命令: docker network ls
    name: <your-overlay2-network-name>
