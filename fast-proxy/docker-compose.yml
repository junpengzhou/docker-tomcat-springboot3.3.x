version: '3.8'
services:
  fast-proxy:
    build: .
    container_name: fast-proxy
    image: fast-proxy:latest
    restart: unless-stopped
    environment:
      - PROXY_MODE=http
      - PROXY_USER=admin
      - PROXY_PASS=changeMeInProdUse
      - PROXY_PORT=1080
    ports:
      - "1080:1080"
    networks:
      - app-net

networks:
  app-net:
    external: true
    # 替换为实际的 Docker overlay2 网络名称
    # 查看命令: docker network ls
    name: <your-overlay2-network-name>
